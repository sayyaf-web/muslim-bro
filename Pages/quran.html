<!DOCTYPE html>
<html lang="en">
<head>

<title>Holy Quran - MuslimBro</title>

<link rel="stylesheet" href="../styles.css">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

header{
    background:#0d3b2e;
    color:white;
    padding:16px;
    text-align:center;
}

#surah-list{
    padding:15px;
}

.surah-card{

    padding:15px;

    cursor:pointer;

.surah-card h3{
    margin:0;
    color:#0d3b2e;

.surah-card p{
    margin:6px 0;
    font-size:22px;

.surah-card small{
