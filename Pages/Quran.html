<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Quran | Muslim Bro</title>

<link rel="manifest" href="../manifest.json">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#f5f7f8;

color:#222;

}

header{

background:#0b7d57;

color:white;

padding:20px;

text-align:center;

box-shadow:0 2px 10px rgba(0,0,0,.15);

}

header h1{

font-size:28px;

margin-bottom:6px;

}

header p{

opacity:.9;

font-size:15px;

}

.searchBox{

padding:15px;

background:white;

position:sticky;

top:0;

z-index:20;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.searchBox input{

width:100%;

padding:14px;

border-radius:12px;

border:1px solid #ddd;

font-size:16px;

outline:none;

}

#surahList{

padding:14px;

}

.card{

background:white;

margin-bottom:14px;

padding:16px;

border-radius:16px;

display:flex;

justify-content:space-between;

align-items:center;

cursor:pointer;

transition:.2s;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.card:hover{

transform:scale(1.01);

}

.left{

display:flex;

align-items:center;

gap:14px;

}

.number{

width:42px;

height:42px;

border-radius:50%;

background:#0b7d57;

color:white;

display:flex;

align-items:center;

justify-content:center;

font-weight:bold;

}

.names h3{

font-size:18px;

}

.names small{

color:#666;

}

.arabic{

font-size:24px;

font-weight:bold;

color:#0b7d57;

}

.arrow{

font-size:24px;

color:#999;

}

</style>

</head>

<body>

<header>

<h1>📖 Holy Quran</h1>

<p>114 Surahs</p>

</header>

<div class="searchBox">

<input
id="search"
type="text"
placeholder="Search Surah...">

</div>

<div id="surahList">

</div><script src="../quran.js"></script>

<script>

const list=document.getElementById("surahList");

const search=document.getElementById("search");

function renderSurahs(filter=""){

list.innerHTML="";

quranData
.filter(s=>{

const name=s.englishName.toLowerCase();

const arabic=s.name;

return name.includes(filter.toLowerCase())||

arabic.includes(filter);

})
.forEach(s=>{

const card=document.createElement("div");

card.className="card";

card.onclick=()=>{

location.href=`surah.html?id=${s.number}`;

};

card.innerHTML=`

<div class="left">

<div class="number">

${s.number}

</div>

<div class="names">

<h3>${s.englishName}</h3>

<small>

${s.englishNameTranslation}

<br>

${s.numberOfAyahs} Verses • ${s.revelationType}

</small>

</div>

</div>

<div>

<div class="arabic">

${s.name}

</div>

<div class="arrow">

➜

</div>

</div>

`;

list.appendChild(card);

});

}

search.addEventListener("input",e=>{

renderSurahs(e.target.value);

});

renderSurahs();

</script>

</body>

</html>
