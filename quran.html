<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Holy Quran | Muslim Bro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7f4;
}

header{
background:#0b8457;
color:#fff;
padding:20px;
text-align:center;
}

header h1{
font-size:28px;
margin-bottom:8px;
}

#search{
width:90%;
margin:20px auto;
display:block;
padding:14px;
font-size:16px;
border:none;
border-radius:10px;
outline:none;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

#surahList{
padding:15px;
}

.card{
background:#fff;
padding:18px;
margin-bottom:12px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
transition:.2s;
}

.card:hover{
transform:scale(1.02);
}

.left h3{
color:#0b8457;
margin-bottom:5px;
}

.left p{
color:#666;
}

.right{
font-size:26px;
}

footer{
padding:20px;
text-align:center;
color:#666;
}
</style>

</head>
<body>

<header>
<h1>📖 Holy Quran</h1>
<p>Read all 114 Surahs</p>
</header>

<input
type="text"
id="search"
placeholder="Search Surah...">

<div id="surahList"></div>

<footer>
Muslim Bro © 2026
</footer>

<script>

let surahs=[];

async function loadSurahs(){

const response=await fetch("https://api.alquran.cloud/v1/surah");

const data=await response.json();

surahs=data.data;

showSurahs(surahs);

}

function showSurahs(list){

const container=document.getElementById("surahList");

container.innerHTML="";

list.forEach(s=>{

container.innerHTML+=`

<div class="card" onclick="openSurah(${s.number})">

<div class="left">

<h3>${s.number}. ${s.englishName}</h3>

<p>${s.name}</p>

</div>

<div class="right">📖</div>

</div>

`;

});

}

document.getElementById("search").addEventListener("input",function(){

const text=this.value.toLowerCase();

const filtered=surahs.filter(s=>

s.englishName.toLowerCase().includes(text)||

s.name.includes(text)

);

showSurahs(filtered);

});

function openSurah(number){

window.location.href="surah.html?id="+number;

}

loadSurahs();

</script>

</body>
</html>
