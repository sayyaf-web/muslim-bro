<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Digital Tasbih</title>

<link
rel="stylesheet"
href="../styles.css">

<link
rel="stylesheet"
href="../css/tasbih.css">

</head>

<body>

<!-- ===========================
BACKGROUND OVERLAY
============================ -->

<div class="backgroundOverlay"></div>

<!-- ===========================
HERO
============================ -->

<header class="tasbihHero">

<div class="heroOverlay">

<h1>

📿 Digital Tasbih

</h1>

<p>

"Indeed, in the remembrance of Allah do hearts find rest."

</p>

<small>

— Qur'an 13:28

</small>

</div>

</header>

<!-- ===========================
MAIN
============================ -->

<main class="tasbihContainer">

<div class="tasbihCard">

<h2 id="dhikrTitle">

SubhanAllah

</h2>

<select id="dhikrSelect">

<option value="SubhanAllah">SubhanAllah</option>

<option value="Alhamdulillah">Alhamdulillah</option>

<option value="Allahu Akbar">Allahu Akbar</option>

<option value="La ilaha illallah">La ilaha illallah</option>

<option value="Astaghfirullah">Astaghfirullah</option>

<option value="Allahumma Salli Ala Muhammad">
Allahumma Salli Ala Muhammad ﷺ
</option>

<option value="Custom">
Custom Dhikr
</option>

</select><!-- ===========================
COUNTER
============================ -->

<div class="counterWrapper">

<div class="counterGlow"></div>

<div class="counterCircle">

<div
id="counter"
class="counter">

0

</div>

</div>

</div>

<div
id="goalText"
class="goalText">

Goal: 33

</div>

<!-- ===========================
PROGRESS
============================ -->

<div class="progressContainer">

<div
id="progressBar"
class="progressBar">

</div>

</div>

<!-- ===========================
COUNTING MODE
============================ -->

<div class="modeContainer">

<label class="modeCard">

<input
type="radio"
name="mode"
value="tap"
checked>

<span>

👆 Tap Mode

</span>

</label>

<label class="modeCard">

<input
type="radio"
name="mode"
value="voice">

<span>

🎤 Voice Mode

</span>

</label>

</div>

<!-- ===========================
VOICE STATUS
============================ -->

<div
id="voiceStatus"
class="voiceStatus">

👆 Tap Mode Enabled

</div><!-- ===========================
DIGITAL MISBAHA
============================ -->

<div
id="misbaha"
class="misbaha">

<!-- Beads are generated automatically by JavaScript -->

</div>

<!-- ===========================
BUTTONS
============================ -->

<div class="tasbihButtons">

<button
id="tapBtn"
class="primaryBtn">

📿 Count

</button>

<button
id="undoBtn"
class="secondaryBtn">

↩ Undo

</button>

<button
id="resetBtn"
class="dangerBtn">

🔄 Reset

</button>

</div>

<div class="tasbihButtons">

<button
id="saveBtn"
class="secondaryBtn">

💾 Save Session

</button>

<button
id="historyBtn"
class="secondaryBtn">

📊 History

</button>

</div>

<!-- ===========================
SESSION INFO
============================ -->

<div
id="sessionInfo"
class="sessionInfo">

Today's Count: 0

</div></div>

</main>

<!-- ===========================
PREMIUM MODAL
============================ -->

<div id="premiumModal" class="premiumModal">

<div class="premiumCard">

<div
id="modalIcon"
class="modalIcon">

🌿

</div>

<h2 id="modalTitle">

MashaAllah

</h2>

<p id="modalMessage">

You completed your Tasbih.

</p>

<button id="modalButton">

Continue

</button>

</div>

</div>

<!-- ===========================
FOOTER
============================ -->

<footer class="tasbihFooter">

<p>

☪ Muslim Bro

</p>

<p>

Digital Tasbih • Remember Allah Everywhere

</p>

</footer>

<!-- ===========================
SCRIPT
============================ -->

<script src="../js/tasbih.js"></script>

</body>

</html>
