<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Hijri Calendar</title>

<link rel="stylesheet"
href="calendar.css">

</head>

<body>

<header class="topBar">

<button id="backBtn">
←
</button>

<div class="titleArea">

<h1 id="monthName">
Loading...
</h1>

<p id="hijriMonth">
Loading...
</p>

</div>

<div class="navButtons">

<button id="prevMonth">
❮
</button>

<button id="nextMonth">
❯
</button>

</div>

</header>

<div class="weekDays">

<div>Sun</div>
<div>Mon</div>
<div>Tue</div>
<div>Wed</div>
<div>Thu</div>
<div>Fri</div>
<div>Sat</div>

</div>

<div
class="calendarGrid"
id="calendarGrid">

<!-- Calendar generated by JS -->

</div>

<div class="eventCard">

<h3>
🌙 Islamic Event
</h3>

<p id="eventText">

No event today.

</p>

</div>

<script src="calendar.js"></script>

</body>

</html>
