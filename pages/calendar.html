<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Hijri Calendar</title>

<link
rel="stylesheet"
href="../styles.css">

<link
rel="stylesheet"
href="calendar.css">

</head>

<body>

<header class="calendarHero">

<div class="calendarOverlay">

<h1>

🗓️ Hijri Calendar

</h1>

<p>

Islamic & Gregorian Calendar

</p>

</div>

</header>

<main class="calendarContainer">

<div class="calendarCard">

<div class="calendarTop">

<button
id="prevMonth">

◀

</button>

<div>

<h2 id="monthTitle">

Loading...

</h2>

<p id="hijriTitle">

Loading...

</p>

</div>

<button
id="nextMonth">

▶

</button>

</div>

<div class="todayRow">

<button
id="todayBtn">

📍 Today

</button>

</div>

<div
id="calendarGrid"
class="calendarGrid">

</div>

<div
id="eventText"
class="eventCard">

Select a day

</div>

</div>

</main><!-- ===========================
     BOTTOM ACTIONS
=========================== -->

<div class="calendarActions">

<button
class="actionBtn"
onclick="history.back()">

🏠 Home

</button>

<button
class="actionBtn"
onclick="location.reload()">

🔄 Refresh

</button>

</div>

<footer class="calendarFooter">

<p>

☪ Muslim Bro • Offline Hijri Calendar

</p>

</footer>

<script src="hijri.js"></script>

<script src="calendar.js"></script>

</body>

</html>
