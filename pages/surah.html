<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surah</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

header{
    background:#0d3b2e;
    color:white;
    padding:15px;
    text-align:center;
}

#content{
    padding:15px;
}

.bookmark-btn{
    display:block;
    width:90%;
    margin:15px auto;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#f4b400;
    color:white;
    font-size:18px;
    cursor:pointer;
}

select{
    width:90%;
    display:block;
    margin:15px auto;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

audio{
    width:100%;
    margin:15px 0;
}

.ayah{
    background:white;
    padding:15px;
    margin-bottom:12px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.arabic{
    font-size:30px;
    text-align:right;
    line-height:2;
}

.translation{
    margin-top:10px;
    color:#444;
}
</style>

</head>

<body>

<header>
<h2 id="surah-title">Loading...</h2>
</header>

<button class="bookmark-btn" onclick="bookmarkSurah()">
⭐ Bookmark This Surah
</button>

<select id="reciter" onchange="changeReciter()">
</select>

<div id="content">
Loading Surah...
</div>

<script>

const params = new URLSearchParams(location.search);
const id = params.get("id") || 1;

let currentName = "";

async function loadReciters(){

const response = await fetch("../data/reciters.json");

const reciters = await response.json();

const select = document.getElementById("reciter");

const saved =
localStorage.getItem("selectedReciter") || "ar.alafasy";

select.innerHTML="";

reciters.forEach(r=>{

const option=document.createElement("option");

option.value=r.id;

option.textContent="🎙 "+r.name;

if(r.id===saved){
option.selected=true;
}

select.appendChild(option);

});

}

async function loadSurah(){

await loadReciters();

const response = await fetch(
`https://api.alquran.cloud/v1/surah/${id}/editions/quran-uthmani,en.asad`
);

const json = await response.json();

const arabic=json.data[0];
const english=json.data[1];

currentName=arabic.englishName;

document.getElementById("surah-title").innerHTML=
arabic.englishName+" ("+arabic.name+")";

const reciter=document.getElementById("reciter").value;

let html=`

<audio
id="player"
controls
src="https://cdn.islamic.network/quran/audio-surah/128/${reciter}/${id}.mp3">
</audio>

`;

for(let i=0;i<arabic.ayahs.length;i++){

html+=`

<div class="ayah">

<div class="arabic">
${arabic.ayahs[i].text}
</div>

<div class="translation">
${english.ayahs[i].text}
</div>

</div>

`;

}

document.getElementById("content").innerHTML=html;

}

function changeReciter(){

const reciter=document.getElementById("reciter").value;

localStorage.setItem("selectedReciter",reciter);

const player=document.getElementById("player");

player.src=
`https://cdn.islamic.network/quran/audio-surah/128/${reciter}/${id}.mp3`;

player.load();

}

function bookmarkSurah(){

let bookmarks=
JSON.parse(localStorage.getItem("bookmarks"))||[];

const exists=bookmarks.find(item=>item.id==id);

if(!exists){

bookmarks.push({
id:id,
name:currentName
});

localStorage.setItem(
"bookmarks",
JSON.stringify(bookmarks)
);

alert("✅ Surah bookmarked!");

}else{

alert("⭐ Already bookmarked.");

}

}

loadSurah();

</script>

</body>
</html>
