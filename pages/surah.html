<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Surah - Muslim Bro</title>

<link rel="stylesheet" href="../styles.css">

<style>

body{
margin:0;
background:#f5f5f5;
font-family:Arial,sans-serif;
}

header{

background:#0b8457;

color:white;

padding:18px;

text-align:center;

position:sticky;

top:0;

z-index:100;

box-shadow:0 2px 8px rgba(0,0,0,.15);

}

header h2{

margin:0;

font-size:24px;

}

.controls{

padding:15px;

display:flex;

flex-direction:column;

gap:12px;

}

#reciter{

width:100%;

padding:12px;

font-size:16px;

border-radius:10px;

border:1px solid #ccc;

}

audio{

width:100%;

}

.buttons{

display:flex;

gap:10px;

}

.buttons button{

flex:1;

padding:12px;

border:none;

border-radius:10px;

font-size:16px;

font-weight:bold;

cursor:pointer;

}

.bookmark{

background:#f4b400;

color:white;

}

.share{

background:#0b8457;

color:white;

}

#content{

padding:15px;

}

.ayah{

background:white;

padding:18px;

margin-bottom:18px;

border-radius:14px;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.ayah-number{

width:36px;

height:36px;

border-radius:50%;

background:#0b8457;

color:white;

display:flex;

align-items:center;

justify-content:center;

font-weight:bold;

margin-bottom:15px;

}

.arabic{

font-size:32px;

text-align:right;

line-height:2;

}

.translation{

margin-top:20px;

font-size:18px;

line-height:1.8;

color:#444;

}

.tafsir-btn{

margin-top:18px;

padding:10px 18px;

border:none;

border-radius:8px;

background:#0b8457;

color:white;

cursor:pointer;

}

.tafsir-box{

display:none;

margin-top:15px;

padding:15px;

background:#eef8f2;

border-left:5px solid #0b8457;

border-radius:10px;

line-height:1.8;

}

</style>

</head>

<body>

<header>

<h2 id="surah-title">

Loading...

</h2>

</header>

<div class="controls">

<select id="reciter">

</select>

<audio
id="player"
controls>

</audio>

<div class="buttons">

<button
class="bookmark"
onclick="bookmarkSurah()">

⭐ Bookmark

</button>

<button
class="share"
onclick="shareSurah()">

📤 Share

</button>

</div>

</div>

<div id="content">

Loading Surah...

</div>

<script src="../js/quranAudio.js"></script><script>

const params = new URLSearchParams(location.search);
const id = Number(params.get("id")) || 1;

let currentName = "";

async function loadSurah(){

    await loadReciters();

    const response = await fetch(
        `https://api.alquran.cloud/v1/surah/${id}/editions/quran-uthmani,en.asad`
    );

    const json = await response.json();

    const arabic = json.data[0];
    const english = json.data[1];

    currentName = arabic.englishName;

    document.getElementById("surah-title").textContent =
        `${arabic.englishName} (${arabic.name})`;

    const reciter = document.getElementById("reciter").value;

    await playSurah("player", reciter, id);

    let html = "";

    for(let i = 0; i < arabic.ayahs.length; i++){

        html += `

        <div class="ayah">

            <div class="ayah-number">
                ${arabic.ayahs[i].numberInSurah}
            </div>

            <div class="arabic">
                ${arabic.ayahs[i].text}
            </div>

            <div class="translation">
                ${english.ayahs[i].text}
            </div>

            <button
            class="tafsir-btn"
            onclick="showTafsir(${arabic.ayahs[i].numberInSurah})">

            📚 Show Tafsir

            </button>

            <div
            class="tafsir-box"
            id="tafsir-${arabic.ayahs[i].numberInSurah}">
            </div>

        </div>

        `;

    }

    document.getElementById("content").innerHTML = html;

}

document.getElementById("reciter").addEventListener("change", async ()=>{

    const reciter = document.getElementById("reciter").value;

    localStorage.setItem("selectedReciter", reciter);

    await playSurah("player", reciter, id);

});

function bookmarkSurah(){

    let bookmarks =
    JSON.parse(localStorage.getItem("bookmarks")) || [];

    const exists =
    bookmarks.find(item => item.id == id);

    if(!exists){

        bookmarks.push({
            id:id,
            name:currentName
        });

        localStorage.setItem(
            "bookmarks",
            JSON.stringify(bookmarks)
        );

        alert("✅ Surah bookmarked!");

    }else{

        alert("⭐ Already bookmarked.");

    }

}

function shareSurah(){

    if(navigator.share){

        navigator.share({
            title:currentName,
            text:"Read " + currentName + " on Muslim Bro"
        });

    }else{

        alert("Sharing is not supported on this device.");

    }

}

async function showTafsir(ayah){

    const box = document.getElementById("tafsir-"+ayah);

    if(box.style.display==="block"){

        box.style.display="none";
        return;

    }

    box.style.display="block";
    box.innerHTML="Loading Tafsir...";

    try{

        const response = await fetch(
            `https://api.quran.com/api/v4/tafsirs/169/by_ayah/${id}:${ayah}`
        );

        const json = await response.json();

        if(json.tafsir){

            box.innerHTML = json.tafsir.text;

        }else{

            box.innerHTML = "No Tafsir available.";

        }

    }catch{

        box.innerHTML = "Unable to load Tafsir.";

    }

}

loadSurah();

</script>

</body>
</html>
