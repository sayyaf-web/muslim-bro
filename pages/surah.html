<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Surah</title>

<link rel="stylesheet" href="../styles.css">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
}

header{

background:#0b8457;

color:white;

padding:18px;

text-align:center;

position:sticky;

top:0;

z-index:10;

}

header h2{

margin:0;

font-size:24px;

}

.top-buttons{

display:flex;

gap:10px;

padding:15px;

}

.top-buttons button{

flex:1;

padding:12px;

border:none;

border-radius:10px;

font-size:16px;

cursor:pointer;

}

.bookmark{

background:#f4b400;

color:white;

}

.share{

background:#0b8457;

color:white;

}

#reciter{

width:92%;

margin:auto;

display:block;

padding:12px;

font-size:16px;

border-radius:10px;

border:1px solid #ccc;

}

audio{

width:92%;

display:block;

margin:15px auto;

}

#content{

padding:15px;

}

.ayah{

background:white;

padding:18px;

margin-bottom:15px;

border-radius:12px;

box-shadow:0 2px 6px rgba(0,0,0,.08);

}

.ayah-number{

width:35px;

height:35px;

border-radius:50%;

background:#0b8457;

color:white;

display:flex;

align-items:center;

justify-content:center;

margin-bottom:15px;

font-weight:bold;

}

.arabic{

font-size:32px;

line-height:2;

text-align:right;

}

.translation{

margin-top:18px;

font-size:18px;

color:#444;

line-height:1.7;

}

</style>

</head>

<body>

<header>

<h2 id="surah-title">

Loading...

</h2>

</header>

<div class="top-buttons">

<button class="bookmark"

onclick="bookmarkSurah()">

⭐ Bookmark

</button>

<button class="share"

onclick="shareSurah()">

📤 Share

</button>

</div>

<select id="reciter">

</select>

<audio

id="player"

controls>

</audio>

<div id="content">

Loading Surah...

</div><script src="../js/quranAudio.js"></script>

<script>

const params = new URLSearchParams(location.search);
const id = Number(params.get("id")) || 1;

let currentName = "";

async function loadSurah(){

    await loadReciters();

    const response = await fetch(
        `https://api.alquran.cloud/v1/surah/${id}/editions/quran-uthmani,en.asad`
    );

    const json = await response.json();

    const arabic = json.data[0];
    const english = json.data[1];

    currentName = arabic.englishName;

    document.getElementById("surah-title").innerHTML =
        arabic.englishName + " (" + arabic.name + ")";

    const reciter = document.getElementById("reciter").value;

    await playSurah("player", reciter, id);

    let html = "";

    for(let i = 0; i < arabic.ayahs.length; i++){

        html += `

        <div class="ayah">

            <div class="ayah-number">

                ${arabic.ayahs[i].numberInSurah}

            </div>

            <div class="arabic">

                ${arabic.ayahs[i].text}

            </div>

            <div class="translation">

                ${english.ayahs[i].text}

            </div>

        </div>

        `;

    }

    document.getElementById("content").innerHTML = html;

}

document.getElementById("reciter").addEventListener("change", async ()=>{

    const reciter = document.getElementById("reciter").value;

    localStorage.setItem("selectedReciter", reciter);

    await playSurah("player", reciter, id);

});

function bookmarkSurah(){

    let bookmarks =
    JSON.parse(localStorage.getItem("bookmarks")) || [];

    const exists =
    bookmarks.find(item => item.id == id);

    if(!exists){

        bookmarks.push({

            id:id,

            name:currentName

        });

        localStorage.setItem(
            "bookmarks",
            JSON.stringify(bookmarks)
        );

        alert("✅ Surah bookmarked!");

    }else{

        alert("⭐ Already bookmarked.");

    }

}

function shareSurah(){

    if(navigator.share){

        navigator.share({

            title:currentName,

            text:"Read " + currentName + " on Muslim Bro"

        });

    }else{

        alert("Sharing is not supported on this device.");

    }

}

loadSurah();

</script></body>
</html>
